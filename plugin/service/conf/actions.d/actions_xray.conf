[start]
# v3.0.0: %1 = inst_uuid (опционально; если не указан — запускает все инстансы)
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:start %s
type:script_output
timeout:180
message:Starting Xray

[stop]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:stop %s
type:script_output
timeout:120
message:Stopping Xray

[restart]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:restart %s
type:script_output
timeout:180
message:Restarting Xray

[reconfigure]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:reconfigure %s
type:script_output
timeout:180
message:Reconfiguring Xray

[status]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:status %s
type:script_output
message:Xray status

[statusall]
# v3.0.0: статус всех инстансов в формате JSON {inst_uuid: {status, xray_core, tun2socks}}
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:statusall
type:script_output
message:Xray status all instances

[log]
command:/usr/bin/tail
parameters:-n 300 /var/log/xray-boot.log
type:script_output
message:Xray log

[autoroutelog]
command:/usr/bin/tail
parameters:-n 300 /var/log/xray-autoroute.log
type:script_output
message:Xray autoroute log

[xraylog]
# Per-instance лог: UUID передаётся как %1, скрипт выбирает нужный файл.
command:/usr/local/opnsense/scripts/Xray/xray-log.php
parameters:%s
type:script_output
message:Xray core log

[birdlog]
command:/usr/local/opnsense/scripts/Xray/xray-bird-log.php
type:script_output
message:BIRD log

[dnstaplog]
command:/usr/local/opnsense/scripts/Xray/xray-dnstap-log.php
type:script_output
message:dnstap-bgp log

[birdloglevel]
command:/usr/local/opnsense/scripts/Xray/xray-bird-loglevel.php
parameters:%s
type:script_output
message:BIRD syslog log class

[testconnect]
# BUG-4 FIX: порт читается из config.xml через PHP-скрипт.
command:/usr/local/opnsense/scripts/Xray/xray-testconnect.php
parameters:%s
type:script_output
message:Xray test connection

[validate]
# E5: сухой прогон конфига без применения.
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:validate %s
type:script_output
message:Validate Xray config

[ifstats]
# E4: статистика TUN-интерфейса для панели Diagnostics.
command:/usr/local/opnsense/scripts/Xray/xray-ifstats.php
parameters:%s
type:script_output
message:Xray TUN interface stats

[version]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:version
type:script_output
message:Xray plugin version

[delete]
# v3.1.0: stop instance, destroy TUN and remove per-instance files before delItem
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:delete %s
type:script_output
message:Delete Xray instance resources

[watchdog]
# E1: watchdog — запускается cron каждую минуту, итерирует все инстансы.
command:/usr/local/opnsense/scripts/Xray/xray-watchdog.php
parameters:
type:script_output
message:Xray watchdog check

[ifhealth]
# Every 5 min: Test all IF; if ACTIVE_TUN* SOCKS fails — one-shot reselect.
command:/usr/local/opnsense/scripts/Xray/xray-if-health.php
parameters:
type:script_output
timeout:300
message:Xray IF health check and active tun reselect

[birdactivetun]
# Returns immediately; real probes run as "run" in background (avoids HTTP 504).
command:/usr/local/opnsense/scripts/Xray/xray-bird-active-tun.php
parameters:
type:script_output
timeout:30
message:Schedule active tun2socks selection

[birdactivetunstatus]
command:/usr/local/opnsense/scripts/Xray/xray-bird-active-tun.php
parameters:status
type:script_output
message:Active tun2socks selection status

[birdautoroute]
command:/usr/local/opnsense/scripts/Xray/xray-bird-active-tun.php
parameters:autoroute
type:script_output
timeout:180
message:Auto route tun2socks poll

[birdsync]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:birdsync
type:script_output
timeout:300
message:Sync BIRD with tun2socks state

[bgpwrite]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:bgpwrite
type:script_output
message:Write BIRD BGP peer includes

[wanroutes]
command:/usr/local/opnsense/scripts/Xray/xray-wan-static-routes.php
parameters:sync
type:script_output
timeout:120
message:Sync WAN host routes for BGP peers and instance servers

[bgprestart]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:bgprestart
type:script_output
message:Rewrite BGP peers and restart BIRD

[bgpstatus]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:bgpstatus
type:script_output
message:BIRD BGP peer status

[dnstapconf]
command:/usr/local/opnsense/scripts/Xray/xray-dnstap-conf.php
parameters:get
type:script_output
message:Read dnstap-bgp config files

[dnstapwrite]
command:/usr/local/opnsense/scripts/Xray/xray-dnstap-conf.php
parameters:write
type:script_output
timeout:180
message:Write dnstap-bgp config files

[dnstapstart]
command:/usr/local/opnsense/scripts/Xray/xray-dnstap-conf.php
parameters:start
type:script_output
timeout:180
message:Enable Unbound DNSTap include and start dnstap-bgp

[dnstapstop]
command:/usr/local/opnsense/scripts/Xray/xray-dnstap-conf.php
parameters:stop
type:script_output
message:Stop dnstap-bgp and remove Unbound DNSTap include

[dnstapfetch]
command:/usr/local/opnsense/scripts/Xray/xray-dnstap-conf.php
parameters:fetch
type:script_output
timeout:180
message:Download enabled DNStap domain list URLs and reload dnstap-bgp

[dnstapfetchone]
command:/usr/local/opnsense/scripts/Xray/xray-dnstap-conf.php
parameters:fetchone
type:script_output
timeout:180
message:Download one DNStap URL into cache

[dnstapgeodat]
command:/usr/local/opnsense/scripts/Xray/xray-dnstap-conf.php
parameters:geodatcats
type:script_output
timeout:180
message:Download geosite.dat and list/save categories

[staticconf]
command:/usr/local/opnsense/scripts/Xray/xray-static-conf.php
parameters:get
type:script_output
message:Read Static IP list URLs

[staticwrite]
command:/usr/local/opnsense/scripts/Xray/xray-static-conf.php
parameters:write
type:script_output
timeout:300
message:Save Static URL lists and rebuild BIRD includes from enabled caches

[staticextra]
command:/usr/local/opnsense/scripts/Xray/xray-static-conf.php
parameters:extra
type:script_output
timeout:120
message:Add or remove one Extra IP and rebuild BIRD static routes

[staticextrawrite]
command:/usr/local/opnsense/scripts/Xray/xray-static-conf.php
parameters:extrawrite
type:script_output
timeout:120
message:Replace Extra IP lists and rebuild BIRD static routes

[staticfetchone]
command:/usr/local/opnsense/scripts/Xray/xray-static-conf.php
parameters:fetchone
type:script_output
timeout:180
message:Download one Static URL into cache

[staticfetch]
command:/usr/local/opnsense/scripts/Xray/xray-static-conf.php
parameters:fetch
type:script_output
timeout:600
message:Daily refresh of enabled Static URL caches

[staticgeodat]
command:/usr/local/opnsense/scripts/Xray/xray-static-conf.php
parameters:geodatcats
type:script_output
timeout:180
message:Download geoip.dat and list/save Static categories

[domainroute]
command:/usr/local/opnsense/scripts/Xray/xray-domain-route.php
parameters:%s
type:script_output
timeout:30
message:Resolve domain or check IP and show BIRD routes
