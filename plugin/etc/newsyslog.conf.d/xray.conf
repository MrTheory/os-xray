# newsyslog rotation for os-xray plugin
#
# Format (man newsyslog.conf):
#   logfile_name  [owner:group]  mode  count  size  when  [flags]  [/pid_file]  [sig_num]
#
# count=3  — keep 3 archives
# size=600 — rotate when > 600 KB
# when=*   — size-only (no time schedule)
# flags=JG — J: bzip2; G: allow path glob
#
# No signal: writers append via open/write/close (shell >> or PHP file_put_contents).

/var/log/xray-core.log          644  3  600  *  JG
/var/log/xray-core-*.log        644  3  600  *  JG
/var/log/xray-boot.log          644  3  600  *  JG
/var/log/xray-autoroute.log     644  3  600  *  JG
/var/log/xray-watchdog.log      644  3  100  *  JG
